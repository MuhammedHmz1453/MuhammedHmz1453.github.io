<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#0c0a1a">
  <title>Hamza Karaca · Panel</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
  <link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    /* =========================================================
       Panel teması: sitenin renkleri (koyu lacivert-mor zemin, mor vurgu),
       Figtree yazı tipi ve ışıklı giriş ekranı.
       Sveltia CMS'in kendi renk değişkenleri ezilir; "html:root" seçicisi
       panelin sonradan eklenen stillerinden daha güçlü olsun diye.
       ========================================================= */
    html:root {
      --sui-base-hue: 250;
      --sui-font-family-default: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      --sui-control-medium-border-radius: 10px;
      --sui-button-medium-border-radius: 10px;
      --sui-textbox-border-radius: 10px;
      --hk-glow:
        radial-gradient(40% 55% at 21% 19%, #291f58, transparent),
        radial-gradient(40% 55% at 80% 70%, #1a295e, transparent);
    }

    /* Koyu tema */
    html:root[data-theme="dark"] {
      --sui-foreground-color-1-hsl: 250 30% 97%;
      --sui-foreground-color-2-hsl: 250 20% 84%;
      --sui-foreground-color-3-hsl: 250 14% 72%;
      --sui-foreground-color-4-hsl: 250 12% 62%;
      --sui-foreground-color-5-hsl: 250 10% 42%;
      --sui-background-color-1-hsl: 250 45% 6%;
      --sui-background-color-2-hsl: 250 40% 8%;
      --sui-background-color-3-hsl: 250 34% 11%;
      --sui-background-color-4-hsl: 250 30% 15%;
      --sui-background-color-5-hsl: 250 28% 24%;
      --sui-border-color-1-hsl: 250 22% 42%;
      --sui-border-color-2-hsl: 250 26% 22%;
      --sui-border-color-3-hsl: 250 28% 16%;
      --sui-primary-accent-color-text: hsl(258 100% 80%);
      --sui-primary-accent-color-light: hsl(258 90% 70%);
      --sui-primary-accent-color: hsl(258 85% 64%);
      --sui-primary-accent-color-dark: hsl(258 80% 56%);
      --sui-primary-accent-color-translucent: hsl(258 90% 66% / 55%);
      --sui-primary-accent-color-translucent-light: hsl(258 90% 66% / 35%);
      --sui-hover-background-color: hsl(258 60% 70% / 10%);
      --sui-selected-background-color: hsl(258 80% 66% / 20%);
      --sui-active-background-color: hsl(258 80% 66% / 28%);
      --hk-page: #0c0a1a;
      --hk-title: #fafafa;
      --hk-sub: rgba(244, 244, 245, .62);
    }

    /* Açık tema: sitenin açık temasındaki lila tonlar */
    html:root[data-theme="light"] {
      --sui-foreground-color-1-hsl: 250 30% 8%;
      --sui-foreground-color-2-hsl: 250 15% 24%;
      --sui-foreground-color-3-hsl: 250 10% 36%;
      --sui-foreground-color-4-hsl: 250 8% 46%;
      --sui-foreground-color-5-hsl: 250 8% 66%;
      --sui-background-color-1-hsl: 0 0% 100%;
      --sui-background-color-2-hsl: 250 60% 98.5%;
      --sui-background-color-3-hsl: 250 45% 96%;
      --sui-background-color-4-hsl: 250 40% 93%;
      --sui-background-color-5-hsl: 250 40% 87%;
      --sui-border-color-1-hsl: 250 15% 62%;
      --sui-border-color-2-hsl: 250 25% 80%;
      --sui-border-color-3-hsl: 250 30% 89%;
      --sui-primary-accent-color-text: hsl(258 70% 46%);
      --sui-primary-accent-color-light: hsl(258 75% 60%);
      --sui-primary-accent-color: hsl(258 72% 54%);
      --sui-primary-accent-color-dark: hsl(258 72% 47%);
      --sui-primary-accent-color-translucent: hsl(258 75% 55% / 50%);
      --sui-primary-accent-color-translucent-light: hsl(258 75% 55% / 30%);
      --sui-hover-background-color: hsl(258 70% 60% / 8%);
      --sui-selected-background-color: hsl(258 75% 60% / 14%);
      --sui-active-background-color: hsl(258 75% 60% / 22%);
      --hk-page: #eeedf8;
      --hk-title: #09090b;
      --hk-sub: rgba(9, 9, 11, .6);
      --hk-glow:
        radial-gradient(40% 55% at 21% 19%, #d9cefd, transparent),
        radial-gradient(40% 55% at 80% 70%, #c9d9fd, transparent);
    }

    /* Ana düğmeler (Kaydet, Giriş yap...): mordan laciverte geçişli */
    html body .sui.button.primary:not(:disabled) {
      background-image: linear-gradient(135deg, hsl(262 85% 63%), hsl(232 80% 58%));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 20px -10px hsl(258 90% 55% / .8);
      transition: filter .2s, box-shadow .2s, transform .2s;
    }
    html body .sui.button.primary:not(:disabled):hover {
      filter: brightness(1.08);
      box-shadow: 0 10px 26px -10px hsl(258 90% 55% / .95);
    }

    /* ---------- Site içeriği: bölüm kartları ----------
       Paneldeki dosya listesi (tablo) renkli, simgeli ve açıklamalı kartlara dönüşür.
       Açıklamalar ve renkler sırayla verilir; sıra config.yml'deki "files" sırasıyla aynı:
       1 Giriş, 2 Hakkımda, 3 Hizmetler, 4 Projeler, 5 Yetenekler, 6 Fiyatlandırma,
       7 SSS, 8 İletişim. */
    html body .list-container .list-view {
      padding: 8px clamp(16px, 2.4vw, 28px) 32px;
    }
    html body .list-container .list-view .sui.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      width: 100%;
    }
    html body .list-container .list-view .sui.grid-row {
      --c: 258;
      --ic: 76%;
      position: relative;
      display: flex;
      align-items: flex-start;
      height: auto;
      min-height: 150px;
      padding: 22px 22px 22px;
      border: 1px solid hsl(var(--sui-border-color-3-hsl));
      border-radius: 18px;
      background:
        radial-gradient(120% 90% at 0% 0%, hsl(var(--c) 85% 62% / 13%), transparent 60%),
        hsl(var(--sui-background-color-2-hsl));
      cursor: pointer;
      transition: transform .3s cubic-bezier(.2, .7, .2, 1), border-color .3s, box-shadow .3s;
    }
    html:root[data-theme="light"] .list-container .list-view .sui.grid-row { --ic: 42%; }
    html body .list-container .list-view .sui.grid-row:hover {
      transform: translateY(-3px);
      border-color: hsl(var(--c) 80% 65% / 55%);
      box-shadow: 0 18px 36px -20px hsl(var(--c) 90% 55% / .7);
    }
    html body .list-container .list-view .sui.grid-row:focus-visible {
      outline: 2px solid hsl(var(--c) 85% 65%);
      outline-offset: 2px;
    }
    html body .list-container .list-view .sui.grid-row .sui.grid-cell {
      display: block;
      height: auto;
      padding: 0;
      border: 0;
      background: none;
    }
    html body .list-container .list-view .sui.grid-row .grid-cell.title { flex: 1; min-width: 0; white-space: normal; overflow: visible; }
    html body .list-container .list-view .sui.grid-row .grid-cell.status { position: absolute; right: 52px; top: 22px; }
    html body .list-container .list-view .sui.grid-row .grid-cell.title .label {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      height: auto;
    }
    html body .list-container .list-view .sui.grid-row .grid-cell.title .sui.icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: hsl(var(--c) 85% 62% / 16%);
      box-shadow: inset 0 0 0 1px hsl(var(--c) 85% 70% / 22%);
      color: hsl(var(--c) 85% var(--ic));
      font-size: 24px;
    }
    html body .list-container .list-view .sui.grid-row .grid-cell.title .label > .sui.truncated-text {
      font-size: 1.0625rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: hsl(var(--sui-foreground-color-1-hsl));
    }
    /* Kartın altındaki kısa açıklama */
    html body .list-container .list-view .sui.grid-row .grid-cell.title::after {
      content: var(--aciklama, "");
      display: block;
      margin-top: 6px;
      max-width: 40ch;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      font-size: .875rem;
      line-height: 1.5;
      color: hsl(var(--sui-foreground-color-3-hsl));
    }
    /* Sağ üstte "aç" oku */
    html body .list-container .list-view .sui.grid-row::after {
      content: "arrow_forward";
      position: absolute;
      top: 22px;
      right: 20px;
      font-family: "Material Symbols Outlined";
      font-size: 20px;
      line-height: 1;
      color: hsl(var(--sui-foreground-color-4-hsl));
      transition: transform .3s cubic-bezier(.2, .7, .2, 1), color .3s;
    }
    html body .list-container .list-view .sui.grid-row:hover::after {
      transform: translateX(3px);
      color: hsl(var(--c) 85% var(--ic));
    }
    html body .list-container .list-view .sui.grid-row:nth-child(1) { --c: 258; --aciklama: "Adın, giriş yazısı, sekme başlığı ve en alttaki tanıtım cümlesi."; }
    html body .list-container .list-view .sui.grid-row:nth-child(2) { --c: 205; --aciklama: "Hakkımda yazısı ve konum, diller gibi kısa bilgiler."; }
    html body .list-container .list-view .sui.grid-row:nth-child(3) { --c: 280; --aciklama: "Verdiğin hizmetler: web tasarım, e-ticaret, bakım."; }
    html body .list-container .list-view .sui.grid-row:nth-child(4) { --c: 330; --aciklama: "Proje kartları: ad, açıklama, ekran görüntüsü ve canlı link."; }
    html body .list-container .list-view .sui.grid-row:nth-child(5) { --c: 168; --aciklama: "Kök saldı, büyüyor ve filizleniyor listeleri."; }
    html body .list-container .list-view .sui.grid-row:nth-child(6) { --c: 140; --aciklama: "Başlangıç paketleri; fiyat boşsa “Teklife göre” yazar."; }
    html body .list-container .list-view .sui.grid-row:nth-child(7) { --c: 230; --aciklama: "Sık sorulan sorular ve cevapları."; }
    html body .list-container .list-view .sui.grid-row:nth-child(8) { --c: 38; --aciklama: "E-posta, WhatsApp numarası ve sosyal medya linklerin."; }
    @media (prefers-reduced-motion: reduce) {
      html body .list-container .list-view .sui.grid-row,
      html body .list-container .list-view .sui.grid-row::after { transition: none; }
      html body .list-container .list-view .sui.grid-row:hover,
      html body .list-container .list-view .sui.grid-row:hover::after { transform: none; }
    }

    /* ---------- Giriş ekranı ---------- */
    /* Sitenin arka planı: koyu zemin, sol üstte mor ve sağ altta mavi ışık */
    body:has(.app-shell img.logo + h1) {
      background: var(--hk-glow), var(--hk-page);
      background-attachment: fixed;
    }
    body:has(.app-shell img.logo + h1) .app-shell,
    body:has(.app-shell img.logo + h1) .app-shell > *,
    body:has(.app-shell img.logo + h1) .app-shell .main {
      background: transparent !important;
    }
    .app-shell img.logo:has(+ h1) {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      filter: drop-shadow(0 18px 40px hsl(258 90% 50% / .45));
    }
    .app-shell img.logo + h1 {
      margin-top: 22px;
      text-align: center;
      font-family: "Figtree", system-ui, sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--hk-title);
    }
    /* Başlığın altına kısa bir açıklama */
    .app-shell img.logo + h1::after {
      content: "Sitenin yazılarını, projelerini ve fotoğraflarını buradan düzenle.";
      display: block;
      max-width: 34ch;
      margin: 10px auto 0;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
      color: var(--hk-sub);
    }
    .app-shell img.logo + h1 ~ .buttons .sui.button {
      height: 44px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
    }
    .app-shell img.logo + h1 ~ .buttons .sui.button:not(.primary) {
      background: hsl(250 40% 50% / 8%);
      border-color: hsl(250 40% 70% / 22%);
      color: var(--hk-title);
    }
    /* Canlı sitede tek giriş yolu token: o düğme de ana düğme gibi görünsün */
    .app-shell img.logo + h1 ~ .buttons .sui.button:not(.primary):only-of-type {
      background: linear-gradient(135deg, hsl(262 85% 63%), hsl(232 80% 58%));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 20px -10px hsl(258 90% 55% / .8);
      transition: filter .2s, box-shadow .2s;
    }
    .app-shell img.logo + h1 ~ .buttons .sui.button:not(.primary):only-of-type:hover {
      filter: brightness(1.08);
      box-shadow: 0 10px 26px -10px hsl(258 90% 55% / .95);
    }

    /* Giriş ekranı yumuşakça belirsin */
    @media (prefers-reduced-motion: no-preference) {
      .app-shell img.logo:has(+ h1),
      .app-shell img.logo + h1,
      .app-shell img.logo + h1 ~ * {
        animation: hk-rise .8s cubic-bezier(.2, .7, .2, 1) both;
      }
      .app-shell img.logo + h1 { animation-delay: .08s; }
      .app-shell img.logo + h1 ~ * { animation-delay: .16s; }
      @keyframes hk-rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <!-- Yönetim paneli: Sveltia CMS. Ayarlar aynı klasördeki config.yml dosyasında, tema yukarıda. -->
  <script src="https://unpkg.com/@sveltia/cms@0.255.1/dist/sveltia-cms.js"></script>
</body>
</html>
