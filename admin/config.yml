# Yönetim paneli ayarları (Sveltia CMS)
# Depo adını değiştirirsen aşağıdaki "repo" satırını da güncelle.
backend:
  name: github
  repo: MuhammedHmz1453/MuhammedHmz1453.github.io
  branch: main
  # Sadece erişim token'ı ile giriş (GitHub ile giriş bu kurulumda çalışmıyor, düğmesi gizli)
  auth_methods: [token]
  commit_messages:
    create: "İçerik eklendi: {{slug}}"
    update: "İçerik güncellendi: {{slug}}"
    delete: "İçerik silindi: {{slug}}"
    uploadMedia: "Görsel yüklendi: {{path}}"
    deleteMedia: "Görsel silindi: {{path}}"

# Panelin adı, logosu ve "siteyi gör" bağlantısı
app_title: Hamza Karaca · Panel
logo:
  src: /assets/logo.svg?v=4
display_url: https://mhkaraca.vercel.app

# Bu sitede sayfa önizlemesi yok; düzenleme ekranı tam genişlikte açılsın
editor:
  preview: false

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: site
    label: Site içeriği
    icon: web
    description: Sitedeki her bölümün yazıları. Kaydettikten 1–2 dakika sonra sitede görünür.
    files:
      # ---------- Genel ----------
      - name: genel
        icon: home
        description: "Adın, giriş yazısı, sekme başlığı ve en alttaki tanıtım."
        label: Giriş ve genel bilgiler
        file: _data/genel.yml
        fields:
          - { name: site_adi, label: Site adı, widget: string, required: false, hint: "Tarayıcı sekmesinde ve sayfanın en altındaki logonun yanında görünür. Örnek: MHK" }
          - { name: logo_yazi, label: Logodaki yazı, widget: string, required: false, hint: "Sol üstte logonun yanındaki kısa yazı. Örnek: MHK" }
          - { name: google_dogrulama, label: Google doğrulama kodu, widget: string, required: false, hint: "Google Search Console > HTML etiketi yöntemi: content=\"...\" içindeki kodu buraya yapıştır. Boş bırakılabilir." }
          - { name: ad, label: Ad, widget: string, hint: "Giriş bölümündeki büyük başlığın ilk satırı. Örnek: Muhammed Hamza" }
          - { name: soyad, label: Soyad, widget: string, hint: "Başlığın ikinci satırı, eğik yazıyla." }
          - { name: unvan, label: Unvan, widget: string, hint: "Link paylaşımlarında (WhatsApp, Instagram) adının yanında görünür." }
          - { name: durum_goster, label: Durum satırını göster, widget: boolean, default: true }
          - { name: durum, label: Durum satırı, widget: string, required: false, hint: "Giriş bölümünde butonun yanındaki, yeşil ışıklı iki satır, aralarına “ · ” koy. Örnek: Web geliştirici · Yeni projeler için müsaitim" }
          - { name: slogan, label: Slogan, widget: string, required: false, hint: "Büyük başlığın üstündeki küçük etiket. Örnek: Muhammed Hamza Karaca · Web geliştirici" }
          - { name: baslik, label: Büyük başlık (1. satır), widget: string, required: false, hint: "Girişteki büyük başlık. Boş bırakırsan adın yazar. Örnek: İşletmen için modern" }
          - { name: baslik_vurgu, label: Büyük başlık (2. satır, eğik), widget: string, required: false, hint: "Örnek: web siteleri geliştiriyorum." }
          - { name: etiketler, label: Giriş etiketleri, label_singular: Etiket, widget: list, required: false, hint: "Giriş yazısının altındaki küçük etiketler. Örnek: E-Ticaret" }
          - { name: giris, label: Giriş cümlesi, widget: text, hint: "Adının altındaki 1–2 cümle. Hangi hizmetleri verdiğini açıkça yaz." }
          - { name: alt_yazi, label: Alt bilgi tanıtım cümlesi, widget: text, required: false, hint: "Sayfanın en altında logonun altındaki kısa tanıtım." }
          - { name: seo_aciklama, label: Arama motoru açıklaması, widget: text, hint: "Google sonuçlarında sitenin altında görünen kısa açıklama." }

      # ---------- Hakkımda ----------
      - name: hakkimda
        icon: person
        description: "Hakkımda yazısı ve kısa bilgiler."
        label: Hakkımda
        file: _data/hakkimda.yml
        fields:
          - { name: foto, label: Fotoğraf, widget: image, required: false, hint: "Kare bir fotoğraf en iyi sonucu verir. Boş bırakırsan bu bölümde fotoğraf görünmez." }
          - { name: giris, label: Giriş cümlesi, widget: text, hint: "Büyük yazılan ilk paragraf." }
          - { name: yazi, label: Yazı, widget: markdown, buttons: [bold, italic, link], editor_components: [], hint: "Paragrafları boş bir satırla ayır." }
          - name: bilgiler
            label: Kısa bilgiler
            label_singular: Bilgi
            widget: list
            required: false
            collapsed: true
            summary: "{{baslik}}: {{deger}}"
            fields:
              - { name: baslik, label: Başlık, widget: string, hint: "Örnek: Konum" }
              - { name: deger, label: Değer, widget: string, hint: "Örnek: Türkiye · uzaktan çalışmaya açık" }

      # ---------- Hizmetler ----------
      - name: hizmetler
        icon: design_services
        description: "Verdiğin hizmetler: kurumsal site, e-ticaret, işletme sitesi, site yenileme."
        label: Hizmetler
        file: _data/hizmetler.yml
        fields:
          - { name: baslik, label: Bölüm başlığı, widget: string }
          - { name: aciklama, label: Bölüm açıklaması, widget: text, required: false }
          - name: liste
            label: Hizmetler
            label_singular: Hizmet
            widget: list
            collapsed: true
            summary: "{{ad}}"
            fields:
              - { name: ad, label: Hizmet adı, widget: string }
              - name: ikon
                label: Simge
                widget: select
                default: tasarim
                options:
                  - { label: "Bina (kurumsal site)", value: kurumsal }
                  - { label: "Dükkân (işletme sitesi)", value: isletme }
                  - { label: "Yenileme okları (site yenileme)", value: yenileme }
                  - { label: "Ekran (web tasarım)", value: tasarim }
                  - { label: "Sepet (e-ticaret)", value: eticaret }
                  - { label: "İngiliz anahtarı (bakım)", value: bakim }
                  - { label: "Telefon (mobil uyum)", value: mobil }
                  - { label: "Büyüteç (arama motoru)", value: seo }
                  - { label: "Şimşek (hız)", value: hiz }
              - { name: aciklama, label: Açıklama, widget: text, hint: "1–2 cümle." }
              - { name: maddeler, label: Neler var, label_singular: Madde, widget: list, required: false, hint: "Kartta tik işaretiyle görünür." }

      # ---------- Projeler ----------
      - name: projeler
        icon: work
        description: "Proje kartları: ad, açıklama, ekran görüntüsü ve canlı link."
        label: Projeler
        file: _data/projeler.yml
        fields:
          - { name: aciklama, label: Bölüm açıklaması, widget: string, required: false }
          - name: liste
            label: Projeler
            label_singular: Proje
            widget: list
            summary: "{{ad}}"
            collapsed: true
            hint: "Bir projeye tıklayınca açılır. Sırasını değiştirmek için tutup sürükle."
            fields:
              - { name: ad, label: Proje adı, widget: string }
              - { name: aciklama, label: Açıklama, widget: text, hint: "Proje ne yapıyor? 1–2 cümle yeter." }
              - { name: ozellikler, label: Öne çıkan özellikler, label_singular: Özellik, widget: list, required: false, hint: "Kartta tik işaretiyle görünür. Örnek: Google ile giriş ve puan sistemi" }
              - { name: etiketler, label: Kullanılan teknolojiler, label_singular: Teknoloji, widget: list, required: false, hint: "Her teknolojiyi ayrı ekle. Örnek: HTML, CSS, JavaScript" }
              - name: demo
                label: Canlı link
                widget: string
                type: url
                required: false
                pattern: ['^(https?://\S+)?$', "Link https:// ile başlamalı. Örnek: https://muhammedhmz1453.github.io/todo/"]
                hint: "Projenin tarayıcıda açıldığı adres. Kartta “Canlı link” düğmesi bu adrese gider. Boş bırakırsan düğme görünmez."
              - { name: gorsel, label: Ekran görüntüsü, widget: image, required: false, hint: "Yüklersen kartın üstünde bu görsel görünür. Yatay (16:10) görseller en iyi sonucu verir." }
              - name: cizim
                label: Görsel yoksa kartın üstünde
                hint: "Ekran görüntüsü yüklediysen bu seçim kullanılmaz."
                widget: select
                required: false
                default: duz
                options:
                  - { label: "Proje adı (koyu zemin)", value: duz }
                  - { label: "To-Do çizimi", value: todo }
                  - { label: "Lazer Bahçesi çizimi", value: bahce }
                  - { label: "Site çizimi", value: site }

      # ---------- Yetenekler ----------
      - name: yetenekler
        icon: code
        description: "Kök saldı, büyüyor ve filizleniyor listeleri."
        label: Yetenekler
        file: _data/yetenekler.yml
        fields:
          - { name: aciklama, label: Bölüm açıklaması, widget: text, required: false, hint: "Buradaki tüm yetenekler giriş bölümündeki kayan “Kullandığım teknolojiler” şeridinde de görünür. HTML, CSS, JavaScript, React gibi bilinen teknolojiler logosuyla çıkar." }
          - name: kok_saldi
            label: "Kök saldı (rahatça kullandıkların)"
            label_singular: Yetenek
            widget: list
            required: false
            collapsed: true
            summary: "{{ad}}"
            fields: &yetenek
              - { name: ad, label: Yetenek, widget: string }
              - { name: nerede, label: Kısa not, widget: string, required: false, hint: "Nerede ya da nasıl kullandığın. Örnek: Flexbox, Grid" }
          - name: buyuyor
            label: "Büyüyor (projelerde kullandıkların)"
            label_singular: Yetenek
            widget: list
            required: false
            collapsed: true
            summary: "{{ad}}"
            fields: *yetenek
          - name: filizleniyor
            label: "Filizleniyor (yeni öğrendiklerin)"
            label_singular: Yetenek
            widget: list
            required: false
            collapsed: true
            summary: "{{ad}}"
            fields: *yetenek

      # ---------- Fiyatlandırma ----------
      - name: fiyatlar
        icon: sell
        description: "Başlangıç, Profesyonel ve Premium paketleri ve fiyatları."
        label: Paketlerim
        file: _data/fiyatlar.yml
        fields:
          - { name: baslik, label: Bölüm başlığı, widget: string }
          - { name: aciklama, label: Bölüm açıklaması, widget: text, required: false }
          - { name: not, label: Paketlerin altındaki not, widget: text, required: false, hint: "Ödeme şekli, bakım ücreti gibi açıklamalar. Örnek: Paket fiyatları tek seferliktir; bakım aylık ücretle ayrıca verilir." }
          - name: paketler
            label: Paketler
            label_singular: Paket
            widget: list
            collapsed: true
            summary: "{{ad}}"
            fields:
              - { name: ad, label: Paket adı, widget: string }
              - { name: aciklama, label: Kısa açıklama, widget: text }
              - { name: fiyat, label: Fiyat, widget: string, required: false, hint: "Örnek: 5.000 TL ya da 5.000 TL'den başlayan. Boş bırakırsan kartta “Teklife göre” yazar." }
              - { name: fiyat_notu, label: Fiyatın altındaki not, widget: string, required: false, hint: "Örnek: tek seferlik, aylık, KDV dahil" }
              - { name: one_cikan, label: Öne çıkar (“Önerilen” etiketi), widget: boolean, default: false, required: false }
              - { name: maddeler, label: Pakette neler var, label_singular: Madde, widget: list, required: false }

      # ---------- SSS ----------
      - name: sss
        icon: help
        description: "Sık sorulan sorular ve cevapları."
        label: SSS
        file: _data/sss.yml
        fields:
          - { name: baslik, label: Bölüm başlığı, widget: string }
          - { name: aciklama, label: Bölüm açıklaması, widget: text, required: false }
          - name: sorular
            label: Sorular
            label_singular: Soru
            widget: list
            collapsed: true
            summary: "{{soru}}"
            fields:
              - { name: soru, label: Soru, widget: string }
              - { name: cevap, label: Cevap, widget: text }

      # ---------- İletişim ----------
      - name: iletisim
        icon: mail
        description: "E-posta adresin ve profil linklerin."
        label: İletişim
        file: _data/iletisim.yml
        fields:
          - { name: baslik, label: Başlık, widget: string }
          - { name: yazi, label: Yazı, widget: text }
          - { name: eposta, label: E-posta adresin, widget: string, hint: "Sitede görünür; iletişim formundan gelen mesajlar bu adrese gelir. Değiştirirsen yeni adres için FormSubmit’in gönderdiği onay e-postasını bir kere onaylaman gerekir." }
          - { name: whatsapp, label: WhatsApp numarası, widget: string, required: false, hint: "Örnek: 0555 123 45 67. Yazarsan İletişim bölümünde “WhatsApp'tan yaz” düğmesi çıkar; boş bırakırsan çıkmaz. Numara sitede herkese açık olur." }
          - name: linkler
            label: Profil linkleri
            label_singular: Link
            widget: list
            collapsed: true
            summary: "{{ad}}"
            fields:
              - { name: ad, label: Ad, widget: string, hint: "Instagram, Facebook, X, LinkedIn, GitHub, YouTube, TikTok, WhatsApp, Telegram, Discord, Behance ya da Dribbble yazarsan sayfanın en altında kendi renkli logosuyla görünür." }
              - { name: adres, label: Link, widget: string, hint: "Örnek: https://www.linkedin.com/in/kullaniciadin" }

  # ---------- İngilizce site (/en/) ----------
  - name: site_en
    label: English (İngilizce site)
    icon: translate
    description: 'Sitenin İngilizce sürümü: mhkaraca.vercel.app/en/. Görseller, linkler, fiyatı boş bırakılan paketler ve hizmet simgeleri Türkçe içerikten alınır.'
    files:
    - name: genel_en
      icon: home
      label: Giriş ve genel bilgiler (English)
      description: İngilizce sürüm (/en/). Adın, giriş yazısı, sekme başlığı ve en alttaki tanıtım.
      file: _data/en/genel.yml
      fields:
      - name: unvan
        label: Unvan
        widget: string
        hint: Link paylaşımlarında (WhatsApp, Instagram) adının yanında görünür.
      - name: durum_goster
        label: Durum satırını göster
        widget: boolean
        default: true
      - name: durum
        label: Durum satırı
        widget: string
        required: false
        hint: 'Giriş bölümünde butonun yanındaki, yeşil ışıklı iki satır, aralarına “ · ” koy. Örnek: Web geliştirici · Yeni projeler için müsaitim'
      - name: slogan
        label: Slogan
        widget: string
        required: false
        hint: 'Büyük başlığın üstündeki küçük etiket. Örnek: Muhammed Hamza Karaca · Web geliştirici'
      - name: baslik
        label: Büyük başlık (1. satır)
        widget: string
        required: false
        hint: 'Girişteki büyük başlık. Boş bırakırsan adın yazar. Örnek: İşletmen için modern'
      - name: baslik_vurgu
        label: Büyük başlık (2. satır
        eğik): null
        widget: string
        required: false
        hint: 'Örnek: web siteleri geliştiriyorum.'
      - name: etiketler
        label: Giriş etiketleri
        label_singular: Etiket
        widget: list
        required: false
        hint: 'Giriş yazısının altındaki küçük etiketler. Örnek: E-Ticaret'
      - name: giris
        label: Giriş cümlesi
        widget: text
        hint: Adının altındaki 1–2 cümle. Hangi hizmetleri verdiğini açıkça yaz.
      - name: alt_yazi
        label: Alt bilgi tanıtım cümlesi
        widget: text
        required: false
        hint: Sayfanın en altında logonun altındaki kısa tanıtım.
      - name: seo_aciklama
        label: Arama motoru açıklaması
        widget: text
        hint: Google sonuçlarında sitenin altında görünen kısa açıklama.
    - name: hakkimda_en
      icon: person
      label: Hakkımda (English)
      description: İngilizce sürüm (/en/). Hakkımda yazısı ve kısa bilgiler.
      file: _data/en/hakkimda.yml
      fields:
      - name: giris
        label: Giriş cümlesi
        widget: text
        hint: Büyük yazılan ilk paragraf.
      - name: yazi
        label: Yazı
        widget: markdown
        buttons:
        - bold
        - italic
        - link
        editor_components: []
        hint: Paragrafları boş bir satırla ayır.
      - name: bilgiler
        label: Kısa bilgiler
        label_singular: Bilgi
        widget: list
        required: false
        collapsed: true
        summary: '{{baslik}}: {{deger}}'
        fields:
        - name: baslik
          label: Başlık
          widget: string
          hint: 'Örnek: Konum'
        - name: deger
          label: Değer
          widget: string
          hint: 'Örnek: Türkiye · uzaktan çalışmaya açık'
    - name: hizmetler_en
      icon: design_services
      label: Hizmetler (English)
      description: 'İngilizce sürüm (/en/). Verdiğin hizmetler: kurumsal site, e-ticaret, işletme sitesi, site yenileme.'
      file: _data/en/hizmetler.yml
      fields:
      - name: baslik
        label: Bölüm başlığı
        widget: string
      - name: aciklama
        label: Bölüm açıklaması
        widget: text
        required: false
      - name: liste
        label: Hizmetler
        label_singular: Hizmet
        widget: list
        collapsed: true
        summary: '{{ad}}'
        fields:
        - name: ad
          label: Hizmet adı
          widget: string
        - name: aciklama
          label: Açıklama
          widget: text
          hint: 1–2 cümle.
        - name: maddeler
          label: Neler var
          label_singular: Madde
          widget: list
          required: false
          hint: Kartta tik işaretiyle görünür.
    - name: projeler_en
      icon: work
      label: Projeler (English)
      description: 'İngilizce sürüm (/en/). Proje kartları: ad, açıklama, ekran görüntüsü ve canlı link.'
      file: _data/en/projeler.yml
      fields:
      - name: aciklama
        label: Bölüm açıklaması
        widget: string
        required: false
      - name: liste
        label: Projeler
        label_singular: Proje
        widget: list
        summary: '{{ad}}'
        collapsed: true
        hint: Bir projeye tıklayınca açılır. Sırasını değiştirmek için tutup sürükle.
        fields:
        - name: ad
          label: Proje adı
          widget: string
        - name: aciklama
          label: Açıklama
          widget: text
          hint: Proje ne yapıyor? 1–2 cümle yeter.
        - name: ozellikler
          label: Öne çıkan özellikler
          label_singular: Özellik
          widget: list
          required: false
          hint: 'Kartta tik işaretiyle görünür. Örnek: Google ile giriş ve puan sistemi'
    - name: fiyatlar_en
      icon: sell
      label: Paketlerim (English)
      description: İngilizce sürüm (/en/). Başlangıç, Profesyonel ve Premium paketleri ve fiyatları.
      file: _data/en/fiyatlar.yml
      fields:
      - name: baslik
        label: Bölüm başlığı
        widget: string
      - name: aciklama
        label: Bölüm açıklaması
        widget: text
        required: false
      - name: not
        label: Paketlerin altındaki not
        widget: text
        required: false
        hint: 'Ödeme şekli, bakım ücreti gibi açıklamalar. Örnek: Paket fiyatları tek seferliktir; bakım aylık ücretle ayrıca verilir.'
      - name: paketler
        label: Paketler
        label_singular: Paket
        widget: list
        collapsed: true
        summary: '{{ad}}'
        fields:
        - name: ad
          label: Paket adı
          widget: string
        - name: aciklama
          label: Kısa açıklama
          widget: text
        - name: fiyat
          label: Fiyat
          widget: string
          required: false
          hint: 'Örnek: 5.000 TL ya da 5.000 TL''den başlayan. Boş bırakırsan kartta “Teklife göre” yazar.'
        - name: fiyat_notu
          label: Fiyatın altındaki not
          widget: string
          required: false
          hint: 'Örnek: tek seferlik, aylık, KDV dahil'
        - name: maddeler
          label: Pakette neler var
          label_singular: Madde
          widget: list
          required: false
    - name: sss_en
      icon: help
      label: SSS (English)
      description: İngilizce sürüm (/en/). Sık sorulan sorular ve cevapları.
      file: _data/en/sss.yml
      fields:
      - name: baslik
        label: Bölüm başlığı
        widget: string
      - name: aciklama
        label: Bölüm açıklaması
        widget: text
        required: false
      - name: sorular
        label: Sorular
        label_singular: Soru
        widget: list
        collapsed: true
        summary: '{{soru}}'
        fields:
        - name: soru
          label: Soru
          widget: string
        - name: cevap
          label: Cevap
          widget: text
    - name: iletisim_en
      icon: mail
      label: İletişim (English)
      description: İngilizce sürüm (/en/). E-posta adresin ve profil linklerin.
      file: _data/en/iletisim.yml
      fields:
      - name: baslik
        label: Başlık
        widget: string
      - name: yazi
        label: Yazı
        widget: text
