# Bu dosya yönetim panelinden (/admin) düzenlenir.
baslik: SSS
aciklama: Aklındaki soru burada yoksa bana yazman yeterli.
sorular:
  - soru: Bir site ne kadar sürede hazır olur?
    cevap: Sitenin büyüklüğüne ve içeriklerin hazır olmasına göre değişir. Tanışma görüşmesinden sonra sana tahmini bir süre söylerim.
  - soru: Fiyat neye göre belirleniyor?
    cevap: Sayfa sayısına, istediğin özelliklere ve tasarımın kapsamına göre. Ne istediğini anlattıktan sonra sana özel bir teklif hazırlarım.
  - soru: Site telefonda düzgün görünür mü?
    cevap: Evet. Her siteyi telefon, tablet ve bilgisayarda ayrı ayrı deniyorum.
  - soru: Alan adı (.com) ve barındırma ne olacak?
    cevap: Hangi seçeneklerin sana uygun olduğunu birlikte konuşuruz; alan adı ve barındırmanın kurulumunda yardımcı olurum.
  - soru: Site yayına alındıktan sonra destek veriyor musun?
    cevap: Evet, aylık bakım hizmeti veriyorum. İçerik güncelleme, hata düzeltme, hız ve güvenlik kontrolleri bu hizmete dahildir. Bakım paket fiyatına dahil değildir; aylık ücretini ihtiyacına göre birlikte belirleriz.
  - soru: Paket fiyatları aylık mı, tek seferlik mi?
    cevap: Tek seferlik. Paket ücretini bir kez ödersin; yalnızca yayından sonra bakım istersen aylık ücret alınır.
  - soru: E-ticaret sitesinde kartla online ödeme olacak mı?
    cevap: Hayır. Paketlerde kartla online ödeme altyapısı yoktur. Müşterilerin ürünleri sitende inceleyip siparişlerini WhatsApp üzerinden iletir, ödemeyi havale/EFT ile yapar.
