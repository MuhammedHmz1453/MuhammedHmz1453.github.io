baslik: FAQ
aciklama: If your question isn't here, just write to me.
sorular:
  - soru: How long does it take to build a website?
    cevap: It depends on the size of the site and whether the content is ready. After our first call, I'll give you an estimated timeline.
  - soru: How is the price determined?
    cevap: By the number of pages, the features you want and the scope of the design. Once you tell me what you need, I'll prepare a quote tailored to you.
  - soru: Will the site look good on phones?
    cevap: Yes. I test every site separately on phones, tablets and computers.
  - soru: What about the domain name (.com) and hosting?
    cevap: We'll discuss which options suit you best, and I'll help you set up the domain and hosting.
  - soru: Do you offer support after the site goes live?
    cevap: Yes, I offer a monthly maintenance service. It includes content updates, bug fixes, and speed and security checks. Maintenance is not included in the package price; we set the monthly fee together based on your needs.
  - soru: Are package prices monthly or one-time?
    cevap: One-time. You pay the package fee once; a monthly fee applies only if you want maintenance after launch.
  - soru: Will the e-commerce site accept online card payments?
    cevap: No. The packages don't include online card payment. Your customers browse products on your site, send their orders via WhatsApp and pay by bank transfer.
