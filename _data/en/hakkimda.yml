giris: Hi, I'm Muhammed Hamza. I build fast, modern websites that work flawlessly on phones, for businesses and individuals.
yazi: |-
  A website is your business's shop window on the internet. That's why on every project I first listen to you and your customers, then create a design made just for you. I make sure pages load fast, are easy to use on a phone and help visitors find what they're looking for.

  I test every site on phones, tablets and computers one by one before delivering it. No matter how small your idea is, just write to me for a free quote.
