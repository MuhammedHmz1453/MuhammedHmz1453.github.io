giris: Merhaba, ben Muhammed Hamza. İşletmelere ve kişilere hızlı, modern ve telefonda sorunsuz çalışan web siteleri hazırlıyorum.
yazi: |-
  Bir web sitesi, işletmenin internetteki vitrini. Bu yüzden her projede önce işini ve müşterilerini dinliyor, sonra sana özel bir tasarım hazırlıyorum. Sayfaların hızlı açılmasına, telefonda rahat kullanılmasına ve ziyaretçinin aradığını kolayca bulmasına özen gösteriyorum.

  Sitenin telefonda, tablette ve bilgisayarda sorunsuz çalıştığını tek tek deneyip öyle teslim ediyorum. Fikrin ne kadar küçük olursa olsun, ücretsiz teklif için yazman yeterli.
