aciklama: Hepsi canlı ve çalışıyor. Tıkla, dene.
liste:
  - ad: Lazer Bahçesi
    aciklama: Ahşap dekoratif kutu, saat ve isme özel hediye ürünleri sattığımız şirketin online mağazası.
    ozellikler:
      - Kategoriler, en çok satanlar ve indirimdeki ürünler
      - İsme özel hediye için isim, tarih ve not yazma alanı
