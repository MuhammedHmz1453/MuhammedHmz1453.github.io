# Bu dosya yönetim panelinden (/admin) düzenlenir.
# "fiyat" boş bırakılırsa kartta "Teklife göre" yazar.
baslik: Paketlerim
aciklama: Sana uyan paketi seç, ihtiyacını yaz; sana özel ücretsiz teklif hazırlayayım.
paketler:
  - ad: Başlangıç
    fiyat: 1.500 TL
    fiyat_notu: ''
    aciklama: Yeni başlayan işletmeler ve kişiler için tek sayfalık tanıtım sitesi.
    one_cikan: false
    maddeler:
      - Tek sayfalık modern tasarım
      - Telefona uyumlu
      - İletişim formu
      - Hızlı açılan sayfa
  - ad: Profesyonel
    fiyat: 3.500 TL
    fiyat_notu: ''
    aciklama: Kurumsal ya da işletme sitesi isteyenler için çok sayfalı, sana özel site.
    one_cikan: true
    maddeler:
      - Başlangıç paketindeki her şey
      - Çok sayfalı, sana özel tasarım
      - İçerik düzenleme paneli
      - Arama motorları için temel ayarlar
  - ad: Premium
    fiyat: 5.000 TL
    fiyat_notu: ''
    aciklama: E-ticaret ya da kapsamlı bir site ve yayından sonra düzenli destek.
    one_cikan: false
    maddeler:
      - Profesyonel paketteki her şey
      - Ürün, kategori ve sipariş sayfaları
      - Yayından sonra bakım ve destek
      - Öncelikli iletişim
